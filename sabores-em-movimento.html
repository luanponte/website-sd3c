const q=s=>[...document.querySelectorAll(s)], L=q('.l');
let tl;

    .fromTo('#sab',{scale:.3,autoAlpha:0},{scale:1,autoAlpha:1,duration:1.2,ease:'elastic.out(1,.55)'},3.3)
    .set('#mov',{autoAlpha:1},4.5)
    .fromTo('#mov',{clipPath:'inset(0% 100% 0% 0%)'},{clipPath:F,duration:1,ease:'power2.inOut'},4.5)
    .fromTo('#d06',{scale:.2,rotation:-40,autoAlpha:0},{scale:1,rotation:0,autoAlpha:1,duration:.8,ease:'back.out(1.7)'},4.7)
    .fromTo('#d22',{scale:.2,rotation:40,autoAlpha:0},{scale:1,rotation:0,autoAlpha:1,duration:.8,ease:'back.out(1.7)'},4.9)
    .fromTo(['#de1','#a','#de2'],{y:20,autoAlpha:0},{y:0,autoAlpha:1,duration:.5,ease:'power2.out',stagger:.1},4.8)
    .fromTo('#nov',{y:30,autoAlpha:0},{y:0,autoAlpha:1,duration:.6,ease:'power3.out'},5.4)
    .add(breathe,6);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) tl.progress(1);
}
function breathe(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const g=[['.blk,#s,.ico',-4],['#sub',2],['#sab',3],['#mov',-3],['#de1,#a,#de2,#nov',2]];
  g.forEach(([sel,y],i)=>gsap.to(q(sel),{y,duration:2.2+i*.3,ease:'sine.inOut',yoyo:true,repeat:-1}));
  gsap.to('#d06',{rotation:1.2,duration:2.6,ease:'sine.inOut',yoyo:true,repeat:-1});
  gsap.to('#d22',{rotation:-1.2,duration:3,ease:'sine.inOut',yoyo:true,repeat:-1});
}
document.getElementById('replay').addEventListener('click',build);
build();
