<button id="replay" type="button">Repetir</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const q=s=>[...document.querySelectorAll(s)], L=q('.l'), reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let tl;
function build(){
  tl&&tl.kill(); gsap.killTweensOf(L); gsap.set(L,{clearProps:'all'});
  L.forEach(e=>gsap.set(e,{autoAlpha:0,transformOrigin:e.dataset.o}));
  tl=gsap.timeline();
  tl.fromTo('.blk',{scale:.2,rotation:-18,autoAlpha:0},{scale:1,rotation:0,autoAlpha:1,duration:1,ease:'back.out(1.4)',stagger:.14},0)
    .set('#s',{autoAlpha:1},1.5)
    .fromTo('#s',{clipPath:'inset(0% 0% 100% 0%)'},{clipPath:'inset(0% 0% 0% 0%)',duration:1.1,ease:'power2.inOut'},1.5)
    .fromTo('.ico',{scale:0,autoAlpha:0},{scale:1,autoAlpha:1,duration:.55,ease:'back.out(2.2)',stagger:.1},2.4)
    .add(breathe,3.5);
  if(reduce) tl.progress(1);
}
function breathe(){
  if(reduce) return;
  gsap.to('.blk,#s,.ico',{y:-5,duration:2.6,ease:'sine.inOut',yoyo:true,repeat:-1});
  gsap.to('.l',{scale:'+=0.012',duration:3.2,ease:'sine.inOut',yoyo:true,repeat:-1});
}
document.getElementById('replay').addEventListener('click',build);
build();
</script></body></html>
